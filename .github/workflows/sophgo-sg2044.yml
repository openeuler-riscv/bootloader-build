name: SOPHGO SG2044

on:
  push:
    paths:
      - '.github/workflows/sophgo-sg2044.yml'
      - '.github/workflows/.sophgo-sg204x.*'
      - 'sophgo/sg2044/**'

jobs:

  build-zsbl-sg2044:
    name: Build ZSBL for SG2044
    uses: ./.github/workflows/.sophgo-sg204x.zsbl-build.yml
    with:
      target_name: sophgo-sg2044
      zsbl_repo: revyos/zsbl
      # Branch sg204x as of 20260227
      zsbl_ref: 45054e711d81fbfa1c2167829402d26795199ae7
      zsbl_defconfig: sg2044_defconfig

  build-opensbi-sg2044:
    name: Build OpenSBI for SG2044
    uses: ./.github/workflows/.sophgo-sg204x.opensbi-build.yml
    with:
      target_name: sophgo-sg2044
      opensbi_repo: revyos/opensbi
      # Branch sg204x-v1.8.1 as of 20260225
      opensbi_ref: 175cafd0ca69534c5a6943e1e427150e65fbec23
  build-opensbi-sg2044-rva23:
    name: Build OpenSBI for SG2044 with RVA23 Emu
    uses: ./.github/workflows/.sophgo-sg204x.opensbi-build.yml
    with:
      target_name: sophgo-sg2044-rva23
      opensbi_repo: revyos/opensbi
      # Branch sg204x-v1.8.1-rva23 as of 20260624
      opensbi_ref: cba4ce61561f76e7ab9c78d9160c613bb5f81124

  build-u-root:
    name: Build u-root
    uses: ./.github/workflows/.sophgo-sg204x.u-root-build.yml
    with:
      target_name: sophgo-sg204x
      u_root_repo: openeuler-riscv/u-root
      # Branch sg204x-v0.15 as of 20260407
      u_root_ref: c3d8652700827d7942da9e6512ab56e02cad0a32

  build-kernel-sg2044:
    name: Build Kernel for SG2044
    uses: ./.github/workflows/.sophgo-sg204x.kernel-build.yml
    with:
      target_name: sophgo-sg2044
      kernel_repo: revyos/linux
      # Branch revyos/6.18.y as of 20260618
      kernel_ref: 04c7546e7347311710483e923de0e15f319b26e4
      kernel_defconfig: kexec_defconfig

  prepare-firmware-content-sg2044-rva23:
    name: Prepare Firmware Contents for SG2044 with RVA23 Emu
    needs:
      - build-zsbl-sg2044
      - build-opensbi-sg2044-rva23
      - build-u-root
      - build-kernel-sg2044
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - firmware_target_name: linuxboot-sophgo-sg2044-rva23
            zsbl_target_name: sophgo-sg2044
            opensbi_target_name: sophgo-sg2044-rva23
            u_root_target_name: sophgo-sg204x
            kernel_target_name: sophgo-sg2044
    steps:
      - name: Checkout This Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: u-boot-build
      - name: Setup Work Dirs
        run: |
          mkdir -p dist/riscv64
      - name: Fetch Pre-built ZSBL
        uses: actions/download-artifact@v5
        with:
          name: "zsbl-${{ matrix.zsbl_target_name }}"
          path: dist/riscv64
          merge-multiple: true
      - name: Copy fsbl.bin
        run: |
          cp u-boot-build/sophgo/sg2044/blobs/fsbl.bin dist/riscv64
      - name: Fetch Pre-built OpenSBI
        uses: actions/download-artifact@v5
        with:
          name: "opensbi-${{ matrix.opensbi_target_name }}"
          path: dist/riscv64
          merge-multiple: true
      - name: Fetch Pre-built u-root
        uses: actions/download-artifact@v5
        with:
          name: "u-root-${{ matrix.u_root_target_name }}"
          path: dist/riscv64
          merge-multiple: true
      - name: Fetch Pre-built Kernel
        uses: actions/download-artifact@v5
        with:
          name: "kernel-${{ matrix.kernel_target_name }}"
          path: dist/riscv64
          merge-multiple: true
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "collected-${{ matrix.firmware_target_name }}"
          path: dist

  pack-sd-boot-firmware-sg2044-rva23:
    name: Pack SD Card Boot Image for SG2044 with RVA23 Emu
    needs:
      - prepare-firmware-content-sg2044-rva23
      - pack-nor-boot-firmware-sg2044-rva23
    uses: ./.github/workflows/.sophgo-sg204x.pack-sdimg-with-fwupdate.yml
    with:
      firmware_target_name: linuxboot-sophgo-sg2044-rva23
      mtd_device: /dev/mtd0

  pack-nor-boot-firmware-sg2044-rva23:
    name: Pack NOR Flash Boot Image for SG2044 with RVA23 Emu
    needs: prepare-firmware-content-sg2044-rva23
    runs-on: ubuntu-latest
    env:
      PACKTOOL_PATH: /opt/sophgo-packtool/pack
    strategy:
      matrix:
        include:
          - firmware_target_name: linuxboot-sophgo-sg2044-rva23
    steps:
      - uses: actions/checkout@v6
        with:
          path: ctx
      - name: Setup Work Dirs
        run: |
          mkdir -p staging
          mkdir -p dist
      - name: Setup Pack Tool
        id: setup-pack-tool
        uses: ./ctx/.github/actions/sg204x-pack-tool
      - name: Fetch Collected Files
        uses: actions/download-artifact@v5
        with:
          name: "collected-${{ matrix.firmware_target_name }}"
          path: staging
          merge-multiple: true
      - name: Pack Firmware
        run: |
          BINARY_FILE="dist/firmware-${{ matrix.firmware_target_name }}-nor-boot.bin"
          "${{ steps.setup-pack-tool.outputs.path }}" -a -p fsbl.bin -t 0x80000 -f "staging/riscv64/fsbl.bin" -l 0x7010080000 "${BINARY_FILE}"
          "${{ steps.setup-pack-tool.outputs.path }}" -a -p zsbl.bin -t 0x80000 -f "staging/riscv64/zsbl.bin" -l 0x40000000 "${BINARY_FILE}"
          "${{ steps.setup-pack-tool.outputs.path }}" -a -p fw_dynamic.bin -t 0x80000 -f "staging/riscv64/fw_dynamic.bin" -l 0x80000000 "${BINARY_FILE}"
          "${{ steps.setup-pack-tool.outputs.path }}" -a -p riscv64_Image -t 0x80000 -f "staging/riscv64/riscv64_Image" -l 0x80200000 -o 0x600000 "${BINARY_FILE}"
          "${{ steps.setup-pack-tool.outputs.path }}" -a -p initrd.img -t 0x80000 -f "staging/riscv64/initrd.img" -l 0x8b000000 "${BINARY_FILE}"
          for dtbfile in staging/riscv64/*.dtb; do
            if [ -e "${dtbfile}" ]; then
              "${{ steps.setup-pack-tool.outputs.path }}" -a -p "$(basename "${dtbfile}")" -t 0x80000 -f "${dtbfile}" -l 0x88000000 "${BINARY_FILE}"
            fi
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "firmware-${{ matrix.firmware_target_name }}-nor-boot"
          path: dist

  release:
    name: Release Firmware for SOPHGO SG2044
    needs:
      - pack-sd-boot-firmware-sg2044-rva23
      - pack-nor-boot-firmware-sg2044-rva23
    uses: ./.github/workflows/artifact-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag_name: release-sophgo-sg2044
      release_name: Boot Firmware for SOPHGO SG2044
      run_id: ${{github.run_id}}
      artifact_pattern: "firmware-*"
