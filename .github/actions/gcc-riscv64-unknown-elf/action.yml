name: 'RISCV64 GCC Toolchains'
description: 'Setup GCC Toolchains for RISCV64 Target'
outputs:
  full-prefix:
    description: "Full path prefix of installed toolchain, suitable for CROSS_COMPILE"
    value: /opt/riscv-gnu-toolchain/bin/riscv64-unknown-elf-
  path:
    description: "Path to bin directory where binaries exist"
    value: /opt/riscv-gnu-toolchain/bin/
runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential coccinelle \
          device-tree-compiler u-boot-tools
    - name: Cache RISCV64 GCC Toolchain
      id: cache-gcc-riscv64-unknown-elf
      uses: actions/cache@v5
      with:
        path: /opt/riscv-gnu-toolchain
        key: cache-gcc-riscv64-unknown-elf-ubuntu-24.04-2026.02.13
    - name: Install Build Dependencies
      if: ${{ steps.cache-gcc-riscv64-unknown-elf.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autotools-dev curl python3 python3-pip python3-tomli libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev ninja-build git cmake libglib2.0-dev libslirp-dev libncurses-dev
    - name: Fetch Sources
      if: ${{ steps.cache-gcc-riscv64-unknown-elf.outputs.cache-hit != 'true' }}
      uses: actions/checkout@v6
      with:
        repository: riscv-collab/riscv-gnu-toolchain.git
        ref: 2026.02.13
        fetch-depth: 1
        path: riscv-gnu-toolchain
    - name: Build
      if: ${{ steps.cache-gcc-riscv64-unknown-elf.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: riscv-gnu-toolchain
      run: |
        sudo mkdir -p /opt/riscv-gnu-toolchain
        sudo chown "$(id -u)":"$(id -g)" /opt/riscv-gnu-toolchain
        ./configure --prefix=/opt/riscv-gnu-toolchain --with-cmodel=medany
        make -j$(nproc)
        sudo chown -R root:root /opt/riscv-gnu-toolchain
